<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Apex RP Analysis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ぺこんぽの Apex Legends ランクポイント（RP）推移をグラフ・データ・日別/週別集計で振り返るダッシュボード。" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        if (localStorage.getItem('dark-mode') === 'false') {
          document.documentElement.classList.add('light');
        }
      } catch (e) { /* private mode — stay dark */ }
    </script>
    <!-- Fonts are self-hosted via @fontsource (bundled by the build). -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
