<div class="doc">
  <!-- Section navigation -->
  <div>
    <span class="doc__nav-label">セクション</span>
    <nav class="doc__nav" aria-label="設計書セクション">
      <button
        *ngFor="let section of sections"
        class="doc__nav-btn"
        [class.is-active]="selectedSectionId === section.id"
        (click)="selectSection(section.id)"
      >
        {{ section.title }}
      </button>
    </nav>
  </div>

  <!-- Section body -->
  <div>
    <div *ngIf="selectedSection" class="doc__section">
      <div class="doc__section-head">
        <h2 class="doc__section-title">{{ selectedSection.title }}</h2>
      </div>

      <table class="doc__table">
        <tbody>
          <tr *ngFor="let item of selectedSection.items" class="doc__row">
            <td class="doc__label">{{ item.label }}</td>
            <td class="doc__content">
              <p *ngIf="item.content" class="doc__text">{{ item.content }}</p>
              <div
                *ngIf="item.contentHtml"
                class="doc__rich design-doc-html"
                [innerHTML]="safe(item.contentHtml)"
              ></div>
              <div *ngIf="item.diagram" class="doc__diagram">
                <div class="mermaid">{{ item.diagram }}</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<p class="doc__footer">Apex RP Analysis &bull; Powered by Supabase &amp; Vercel</p>
