<div class="app">
  <div class="container">
    <app-dashboard-header
      [isDark]="isDark"
      [lastUpdated]="lastUpdatedTime"
      (toggleTheme)="toggleDark()"
    ></app-dashboard-header>

    <app-summary-stats
      *ngIf="!loading && !error && records.length > 0"
      [summary]="summary"
      [latestRank]="latestRank"
      [rangeLabel]="rangeLabel"
      [rankThresholds]="rankThresholds"
      [refreshing]="refreshing"
    ></app-summary-stats>

    <app-dashboard-toolbar
      [ranges]="rangeOptions"
      [selectedRange]="selectedRange"
      [loading]="loading"
      [refreshing]="refreshing"
      [canDownload]="records.length > 0"
      (rangeChange)="onRangeChange($event)"
      (refresh)="refresh()"
      (download)="downloadCsv()"
    ></app-dashboard-toolbar>

    <app-view-tabs
      [activeTab]="activeTab"
      [tabs]="tabs"
      (tabChange)="setActiveTab($event)"
    ></app-view-tabs>

    <main>
      <app-state-message
        *ngIf="loading"
        variant="loading"
        title="読み込み中…"
      ></app-state-message>

      <app-state-message
        *ngIf="error"
        variant="error"
        [title]="error"
        hint="環境変数（SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY）を確認してください。"
      ></app-state-message>

      <app-state-message
        *ngIf="!loading && !error && records.length === 0"
        variant="empty"
        title="この期間のデータはまだありません"
        hint="時間をおいて更新ボタンを押してください"
      ></app-state-message>

      <ng-container *ngIf="!loading && !error && records.length > 0">
        <app-rp-trend-chart
          *ngIf="activeTab === 'analysis'"
          [records]="records"
          [themeVersion]="themeVersion"
        ></app-rp-trend-chart>

        <app-record-table
          *ngIf="activeTab === 'table'"
          [records]="records"
          [sortDir]="tableSortDir"
          (toggleSort)="toggleTableSort()"
        ></app-record-table>

        <app-aggregate-table
          *ngIf="activeTab === 'daily'"
          title="日別"
          [countLabel]="dailyRows.length + ' 日分'"
          firstColLabel="日付"
          [rows]="dailyRows"
          [sortDir]="dailySortDir"
          (toggleSort)="toggleDailySort()"
        ></app-aggregate-table>

        <app-aggregate-table
          *ngIf="activeTab === 'weekly'"
          title="週別"
          [countLabel]="weeklyRows.length + ' 週分 · 日曜はじまり'"
          firstColLabel="週"
          [rows]="weeklyRows"
          [sortDir]="weeklySortDir"
          (toggleSort)="toggleWeeklySort()"
        ></app-aggregate-table>
      </ng-container>
    </main>

    <footer class="footer">Apex RP Analysis / Supabase × Vercel</footer>
  </div>
</div>
